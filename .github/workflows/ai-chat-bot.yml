name: 🤖 Dynamic AI Chat SVG

on:
  schedule:
    # Runs at 08:00 and 20:00 UTC
    - cron: '0 8 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:
    # Allows manual triggering
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/ai-chat-bot.yml'

permissions:
  contents: write

concurrency:
  group: dynamic-ai-chat-svg
  cancel-in-progress: false

jobs:
  update-ai-chat-svg:
    name: 🚀 Update AI Chat SVG Message
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          # No external dependencies needed for our script
      
      - name: 🎲 Generate New Chat Message
        run: |
          python3 scripts/generate_chat.py
        env:
          TZ: 'UTC'
      
      - name: 🔍 Check for Changes
        id: verify-changed-files
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git diff --name-only
          fi
      
      - name: 📊 Show Generated Content
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          echo "🤖 New AI Chat Message Generated!"
          if [ -f "data/chat_data.json" ]; then
            echo "📄 Chat Data:"
            cat data/chat_data.json | python -m json.tool
          fi
      
      - name: 💾 Commit and Push Changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "AI Chat Bot 🤖"
          git add chat_conversation.svg data/chat_data.json
          
          # Get the message from the generated data
          MESSAGE=$(python3 -c "
          import json
          try:
              with open('data/chat_data.json', 'r') as f:
                  data = json.load(f)
                  print(data['message'][:50] + '...' if len(data['message']) > 50 else data['message'])
          except:
              print('Updated AI chat SVG')
          ")
          
          git commit -m "🤖 Update AI chat SVG: $MESSAGE" \
                     -m "Generated at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
                     -m "Automated update from GitHub Actions" || exit 0
          
          git push
      
      - name: 📈 Workflow Summary
        if: always()
        env:
          CHAT_CHANGED: ${{ steps.verify-changed-files.outputs.changed }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          changed = os.environ.get("CHAT_CHANGED") == "true"
          lines = ["## 🤖 AI Chat SVG Update Summary", ""]

          if changed:
              lines.append("✅ **Status:** Updated the dynamic SVG")
              data_path = Path("data/chat_data.json")
              if data_path.exists():
                  data = json.loads(data_path.read_text(encoding="utf-8"))
                  lines.append(f"💬 **New message:** {data.get('message', 'Unknown')}")
                  lines.append(f"🕒 **Updated:** {data.get('last_updated', 'Unknown')}")
          else:
              lines.append("ℹ️ **Status:** No generated change")

          lines.extend([
              "",
              "🔄 **Next update:** In 12 hours",
              "⚡ **Manual trigger:** Available through workflow_dispatch",
          ])

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary_path.open("a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      - name: 🎯 Performance Check
        if: always()
        run: |
          echo "⚡ Workflow completed in $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "📊 Repository size: $(du -sh . | cut -f1)"
          echo "🗂️ Files modified: $(git diff --name-only HEAD~1 HEAD 2>/dev/null | wc -l || echo '0')"
